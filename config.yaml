# ==============================================================================
# Amplicon Barcode Analysis Pipeline Configuration
# ==============================================================================
# This file contains user-configurable options for the pipeline.
# Values here can later be overridden via CLI arguments if desired.
# ==============================================================================


# ------------------------------------------------------------------------------
# Run behavior
# ------------------------------------------------------------------------------
run:
  # If true, all results will be recomputed and saved.
  # If false, the pipeline will try to load existing results where possible.
  first_time: false
  
  # Decides if we are running on a local machine or a slurm cluster
  # When running on a slurm cluster the the slurm section of this yaml (further below)
  # should be filled out. 
  machine: "slurm" #local or slurm 


# ------------------------------------------------------------------------------
# Input and output paths
# ------------------------------------------------------------------------------
paths:
  # Mandatory output directory for all pipeline results.
  output_folder: "/g/steinmetz/link/Amplicon_barcode_analysis/bcwithqc_test/cli_count_test"
  # output_folder: "/g/steinmetz/link/Amplicon_barcode_analysis/library_making_test"
  
  # Mandatory input directory for fastq files
  # input_folder: "/g/steinmetz/link/Amplicon_barcode_analysis/bcwithqc_test/bcwithqc_test_fastqs_1"
  input_folder: "/g/steinmetz/link/Amplicon_barcode_analysis/PA_subsampeling/1/HepG2_dual_rep_PA_subsample/subsample_10/QC_filtered/bcwithqc_test"

  # Mandatory library file, supported formats: .tsv, .csv, .xlsx, .rds (dataframe)
  # See 'library_formatting_requirements.txt' 
  library_path: "/g/steinmetz/link/Amplicon_barcode_analysis/library/whole_genome_sublibs_1_to_4_merged_sgRNA_df.rds"
  
  # Mandatory reference star_index file.
  # Can be generated via the make_reference.R script if the align_sequence column is included in the library file. 
  star_index_folder: "/g/steinmetz/link/Amplicon_barcode_analysis/library/star_index_whole_genome_sublibs_1_to_4_sgRNA_only"
  
  # Optional but recommended input_fastq_name_parser.xlsx
  # For matching file names to pipeline specific names. 
  # fastq_name_table_xlsx: "/g/steinmetz/link/Amplicon_barcode_analysis/bcwithqc_test/input_fastq_name_table_template.xlsx"
  fastq_name_table_xlsx: "/g/steinmetz/link/Amplicon_barcode_analysis/bcwithqc_test/input_fastq_name_table_template.xlsx"
  # strict_file_match: true
  #   -> Every file in fastq_name_table_xlsx needs a match in input_folder 
  # strict_file_match: false
  #   -> Pipeline will process only files named in fastq_name_table_xlsx and ignore the rest. 
  strict_file_match: true 

# ------------------------------------------------------------------------------
# Read counting settings
# ------------------------------------------------------------------------------
counting:
  # Method used to count reads or UMIs.
  # Allowed values:
  #   - "bcwithqc" (This will use bcwithqc to count reads and UMIs)  #         
  #   - "align_UMI_tools" (This will use simple STAR alignment to count reads,
  #                        and UMI-tools to identify UMIs (requires regex expression)
  #                       )
  read_counting: "align_UMI_tools"

  # Type of count data used downstream.
  # Allowed values:
  #   - "reads"
  #   - "umis"
  data_type: "reads"
  
  
# ------------------------------------------------------------------------------
# SLURM cluster settings
# ------------------------------------------------------------------------------
slurm:
  account: "lsteinme"   # Name of the Slurm cluster account
  qos: "normal"
  cpus: 1              # cpus per task
  mem: "80g"            # memory allocated to each Job
  wall_time: "01:00:00" # Time-out limit before process is killed. hours:minutes:seconds
  partition: null       # Specific partition
  array: 3             # Resources consumed = Base_Resources * array 
                        # Runtime = Base_runtime / array 
                        # must be at least 1
  email: null           # E-Mail is sent to user when job starts, completes, or fails


# ------------------------------------------------------------------------------
# align_UMI_tools Options
# ------------------------------------------------------------------------------
align_UMI_tools:
  # Regular expression used to extract UMIs from reads (see UMI tools documentation).
  # Required only when UMI-based processing with align_UMI_tools read counting.
  umi_regex: "^(?P<discard_1>.{0,5})(?P<umi_1>.{1})(?P<discard_2>(?:CTTGTGGAAAGGACGAAACACCG){e<=1})(?:[ACGTN]+?)(?P<discard_3>(?:GTTTAAGAGCTATGCTGGA){e<=1}.*)"
  # Example pattern for extracting UMIs from our HepG2 screen
  # "^(?P<discard_1>.{0,5})(?P<umi_1>.{10})(?P<discard_2>[AGC]{2})(?P<discard_3>GTGGAAAGGACGAAACACCG){e<=1}"
  # Discard stagger of 0-5 nt, extract 10 nt UMI, discard 3 nt spacer, discard constantRegion
  # Regex Pattern for CM library
  # "^(?P<discard_1>.{0,5})(?:TCTTGTGGAAAGGACGAAACACCG){e<=1}(?:[ACGTN]+?)(?:GTTTAAGAGCTATGCTGGA){e<=1}(?P<umi_1>.{9})(?:AACAGCATAG){e<=1}"
  
# ------------------------------------------------------------------------------
# bcwithqc Options
# ------------------------------------------------------------------------------
bcwithqc:
  # Path to a bcwithqc config.json file.
  # Required only when using bcwithqc for read counting.
  bcwithqc_config_path: "/g/steinmetz/link/Amplicon_barcode_analysis/library/bcwithqc_config_whole_genome_sublibs_1_to_4.json"
  
  # Optional directory containing pre-existing results from a bcwithqc count run.
  # Leave empty if bcwithqc results should not be reused.
  bcwithqc_dir: ""
  
# ------------------------------------------------------------------------------
# Modules for slurm Cluster
# ------------------------------------------------------------------------------
modules:
  # If true, will try to use module load for the specified modules.
  # If false, the specified modules need to be in PATH. (you can use export path/to/module to achieve that)
  # only seqtk is required when read_counting = align_UMI_tools. 
  use_modules: true
  star_module: "STAR/2.7.11b-GCC-13.2.0"
  samtools_module: "SAMtools/1.21-GCC-13.3.0"
  umi_tools_module: "UMI-tools/1.1.2-foss-2021b-Python-3.9.6"
  seqtk_module: "seqtk/1.3-GCC-11.2.0"
  
# ------------------------------------------------------------------------------
# QC filtering with seqtk
# ------------------------------------------------------------------------------
qc_filtering:
  # If true, FASTQ files are quality-filtered before read counting.
  # If false, the pipeline skips QC filtering.
  run: true

  # Minimum base quality passed to `seqtk seq -q`.
  # Default: 20
  min_qual: 20

  # Quality offset passed to `seqtk seq -Q`.
  # Default: 20
  qual_offset: 20

  # Minimum read length passed to `seqtk seq -L`.
  # If null, the pipeline will determine this automatically.
  # Suggested automatic behavior: use sjdbOverhang + 1 if available,
  # or infer from read length / STAR settings.
  min_length: null
  
# ------------------------------------------------------------------------------
# Files, sublibraries, or samples to exclude
# ------------------------------------------------------------------------------
skip:
  # Individual files to skip.
  # Example: ["I_L3_5", "U_L1_2"]
  files: []

  # Entire sublibraries to skip.
  # Example: ["L4", "L5"]
  sublibraries: []

  # Entire sample numbers to skip.
  # Example: ["1", "24"]
  samples: []


# ------------------------------------------------------------------------------
# Controls and target lists
# ------------------------------------------------------------------------------
controls:
  # Extra targets or controls that should be included in the analysis.
  # any gene that matches an entry in include_controls will be treated as 
  # targeting, even if it is a control. 
  include_controls:
    - "EGFP"
    - "AAVS1_9"
    - "AAVS1_13"
    - "AAVS1_18"
    - "AAVS1_19"
    - "AAVS1_25"
    - "AAVS1_35"

  # Optional: restrict analysis to use only specified controls.
  use_only_these_controls: []

  # Are all non-targeting control sgRNAs the same across all sublibraries/replicates?
  same_controls_in_all_sublibraries: true

  # If true, keep 10% of control sgRNAs.
  # To check the distribution of control sgRNAs after MAUDE runs. 
  # This introduces randomness and should usually be false for final analyses.
  subsample_controls: false


# ------------------------------------------------------------------------------
# Replicate and grouping behavior
# ------------------------------------------------------------------------------
replicates:
  # Defines what should be treated as replicates in the experiment.
  # Allowed values:
  #   - ""             : no replicate grouping
  #   - "rep"          : each group of bins is its own replicate
  #   - "rep_sample"   : group by sample 
  #   - "rep_sublib"   : group by sublibrary
  method: ""

  # Automatically combine replicates where appropriate.
  auto_combine_replicates: false

  # How to combine data for guide-level statistics.
  # Allowed values:
  #   - "" <- none (don't type "none" just "")
  #   - "sample"
  #   - "sublib"
  combine_for_guide_stats: "sample"

  # How to combine data for gene-level statistics.
  # Allowed values:
  #   - "none"
  #   - "all"
  #   - "sample"
  #   - "sublib"
  combine_for_gene_stats: "none"


# ------------------------------------------------------------------------------
# Normalization and bin settings
# ------------------------------------------------------------------------------
normalization:
  # Normalization method.
  # Allowed values:
  #   - ""
  #   - "control_median"
  norm_method: "control_median"

  # Estimate missing input/unsorted data based on existing input/unsorted data.
  recover_input: true

  # Fraction used for the upper and lower sorted bins.
  # Example: 0.10 means upper 10% and lower 10%.
  upper_lower_percentage: 0.10

  # Use custom bin fractions instead of upper_lower_percentage.
  use_custom_bins: false


# ------------------------------------------------------------------------------
# Filtering behavior
# ------------------------------------------------------------------------------
filtering:
  # Remove guides/rows with no reads or UMIs across all relevant bins.
  drop_0s: false

  # Remove guides that have a count of 0 in any bin.
  strict_mode: false

  # Minimum number of guides required per gene and replicate.
  # Use 0 to disable this filter.
  min_guides_per_gene: 0


# ------------------------------------------------------------------------------
# Output naming
# ------------------------------------------------------------------------------
output:
  # Optional suffix added to output files/folders.
  # Useful for distinguishing different parameter runs.
  extra_suffix: ""
