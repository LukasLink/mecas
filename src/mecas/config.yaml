# ==============================================================================
# MECAS Pipeline Configuration
# ==============================================================================
# This file contains user-configurable options for the pipeline.
#
# Settings with a corresponding MECAS CLI option are overridden by the CLI
# value when the pipeline is launched through mecas.py.
# CLI options (even defaults) always take precedent!
# The corresponding CLI option is documented below where applicable.
# ==============================================================================

# ------------------------------------------------------------------------------
# Input and output paths
# ------------------------------------------------------------------------------
paths:
  # Mandatory output directory for all pipeline results.
  # CLI: --output-dir
  output_folder: "/g/steinmetz/link/Amplicon_barcode_analysis/snake_test/tiny_test_set_pe_3x_v1"

  # Mandatory input directory containing the FASTQ files.
  # CLI: --input-dir
  input_folder: "/g/steinmetz/link/Amplicon_barcode_analysis/RAW/tiny_test_set_pe_3x"

  # Mandatory library annotation file.
  # Supported formats: .tsv, .csv, .xlsx, .rds (dataframe)
  # See 'library_formatting_requirements.txt'.
  # CLI: --library-file
  library_path: "/g/steinmetz/link/Amplicon_barcode_analysis/library/CM_specific_library.rds"

  # Mandatory bcwithqc configuration file.
  # CLI: --bcwithqc-config-file
  bcwithqc_config_path: "/g/steinmetz/link/Amplicon_barcode_analysis/library/bcwithqc_config_CM_specific_library.json"

  # Experiment information spreadsheet used to match FASTQ files to pipeline
  # sample names, sublibraries, bins, and read directions.
  # CLI: --experiment-info-file
  fastq_name_table_xlsx: "/g/steinmetz/link/Amplicon_barcode_analysis/library/tiny_test_set_pe_3x.xlsx"

# ------------------------------------------------------------------------------
# Read counting settings
# ------------------------------------------------------------------------------
counting:
  # Type of count data used downstream.
  # Allowed values:
  #   - "reads"
  #   - "umis"
  # CLI: --reads-or-umis {reads,umis}
  data_type: "reads"

  # Treat each sgRNA-UMI combination as belonging to its own pseudo-sublibrary.
  # This allows individual UMIs to act as replicates during downstream analysis.
  # CLI: --umis-as-sublibs
  # The CLI flag enables this option; omitting it leaves it disabled.
  umis_as_sublibs: false
 
# ------------------------------------------------------------------------------
# QC filtering with cutadapt
# ------------------------------------------------------------------------------
qc_filtering:
  # If true, FASTQ files are quality-filtered with cutadapt before read counting.
  # If false, QC filtering is skipped and the input FASTQ files are passed
  # directly to downstream processing.
  #
  # Default: true
  # CLI: --skip-qc-filtering
  # The CLI flag sets this option to false.
  run: true
  # Minimum base quality passed to cutadapt.
  # Default: 20
  min_qual: 20

  # Minimum read length passed to cutadapt.
  # If null, the pipeline determines this automatically from the most common
  # read length * 0.8. bcwithqc separately removes reads that can no longer
  # match the required constant sequences.
  min_length: null
      # Forward and reverse reads can alternatively be configured separately.
      # In that case, remove the min_length entry above entirely.
      # R1: 150
      # R2: 161
  
# ------------------------------------------------------------------------------
# Files, sublibraries, or samples to exclude
# ------------------------------------------------------------------------------
skip:
  # Individual files to skip.
  # Example: ["top20_library3_sample1", "unsorted_bin.fastq.gz"]
  files: []

  # Entire sublibraries to skip.
  # Example: ["L4", "sublib5"]
  sublibraries: []

  # Entire sample numbers to skip.
  # Example: ["1", "sampleA"]
  samples: []


# ------------------------------------------------------------------------------
# Controls and target lists
# ------------------------------------------------------------------------------
controls:
  # Extra targets or controls that should be included in the analysis.
  # any gene that matches an entry in include_controls will be treated as 
  # targeting, even if it is a control. 
  include_controls:
    # - "EGFP"
    # - "AAVS1_9"
    # - "AAVS1_13"
    # - "AAVS1_18"
    # - "AAVS1_19"
    # - "AAVS1_25"
    # - "AAVS1_35"

  # Optional: restrict analysis to use only specified controls.
  use_only_these_controls: []

  # Are all non-targeting control sgRNAs the same across all sublibraries/replicates?
  same_controls_in_all_sublibraries: true

  # If true, keep 10% of control sgRNAs.
  # To check the distribution of control sgRNAs after MAUDE runs. 
  # This introduces randomness and should usually be false for final analyses.
  subsample_controls: false


# ------------------------------------------------------------------------------
# Replicate and statistical grouping behavior
# ------------------------------------------------------------------------------
replicates:
  # Defines which groups are treated as separate experiments when calculating
  # guide-level statistics.
  #
  # YAML values:
  #   - ""           : no separation
  #   - "rep"        : separate by bin group
  #   - "rep_sample" : separate by sample
  #   - "rep_sublib" : separate by sublibrary
  #
  # CLI: --separate-statistics-by {none,sample,sublib,bin-group}
  #
  # CLI -> YAML mapping:
  #   none      -> ""
  #   sample    -> "rep_sample"
  #   sublib    -> "rep_sublib"
  #   bin-group -> "rep"
  method: ""

  # Automatically combine replicates where appropriate.
  auto_combine_replicates: false

  # How to combine raw count data BEFORE calculating guide-level statistics.
  # Counts for the same sgRNA are summed across the selected dimension while
  # the other dimensions remain separate.
  #
  # YAML values:
  #   - ""       : do not sum counts across samples or sublibraries
  #   - "sample" : for each sgRNA, sublibrary, and bin, sum across samples
  #   - "sublib" : for each sgRNA, sample, and bin, sum across sublibraries
  #
  # CLI: --sum-sgrna-counts-for-guide-level-by {none,sample,sublib}
  #
  # CLI -> YAML mapping:
  #   none   -> ""
  #   sample -> "sample"
  #   sublib -> "sublib"
  #
  # Example for "sample":
  #   sgRNA1, L1, bin1, sampleA = 10
  #   sgRNA1, L1, bin1, sampleB = 15
  #   -> sgRNA1, L1, bin1, combined_samples = 25
  combine_for_guide_stats: "sample"

  # Overrides the experiment separation used for gene-level statistics after
  # guide-level statistics have already been calculated.
  #
  # YAML values:
  #   - "none"   : retain the existing experiment separation
  #   - "sample" : combine samples while keeping sublibraries separate
  #   - "sublib" : combine sublibraries while keeping samples separate
  #   - "all"    : combine samples and sublibraries into one gene-level result
  #
  # CLI: --separate-statistics-for-gene-level-by {none,sample,sublib,all}
  combine_for_gene_stats: "none"


# ------------------------------------------------------------------------------
# Normalization and bin settings
# ------------------------------------------------------------------------------
normalization:
  # Normalization method.
  # Allowed values:
  #   - ""
  #   - "control_median"
  norm_method: "control_median"

  # Estimate missing input/unsorted data based on existing input/unsorted data.
  recover_input: false

# ------------------------------------------------------------------------------
# Filtering behavior
# ------------------------------------------------------------------------------
filtering:
  # Remove guides/rows with no reads or UMIs across all relevant bins.
  drop_0s: false

  # Remove guides that have a count of 0 in any bin.
  strict_mode: false

  # Minimum number of guides required per gene and replicate.
  # Use 0 to disable this filter.
  min_guides_per_gene: 0
# ------------------------------------------------------------------------------
# MAUDE consensus calling
# ------------------------------------------------------------------------------
# MAUDE contains a small amount of randomness due to subsampling.
# Consensus calling can reduce the effect of this randomness by running MAUDE
# repeatedly and combining the results.
consensus:
  # Enable repeated MAUDE runs and consensus calling.
  # CLI: --run-consensus-call
  # The CLI flag enables this option; omitting it leaves it disabled.
  run: false

  # Number of repetitions IN ADDITION to the initial MAUDE run.
  # 19 therefore results in 20 MAUDE runs in total.
  n_reps: 19

  high_confidence:
    FDR_threshold: 0.05
    hits_in_X_reps: 16
    correlation_heatmap: false # not currently implemented
    venn_diagram: false # not currently implemented

  explorative:
    FDR_threshold: 0.05
    hits_in_X_reps: 10
    correlation_heatmap: false # not currently implemented
    venn_diagram: false # not currently implemented
# ------------------------------------------------------------------------------
# Output naming
# ------------------------------------------------------------------------------
output:
  # Optional suffix added to output files/folders.
  # Useful for distinguishing different parameter runs.
  extra_suffix: ""
  # Includes HepG2 and cardiomycocyte expression data and other information in final output
  # These were mostly useful for our speficic experiment and are disabled by default. 
  full_add_info: false
# ------------------------------------------------------------------------------
# Plotting options
# ------------------------------------------------------------------------------  
plots:
  read_count_violin:
    # Optional fixed Y-axis limit for read/UMI count violin plots.
    # null = determine the limit automatically.
    violin_y_limit: null
    
  waterfall:
  
    mark_cntrl: true
    mark_special: null       # or ["AHSA1", "AGO2"]
    mark_N_top_hits: 3
    box_padding: 0.8
    no_text: false
    signif_lines: true
    mark_all_signif_level: 0.05 # FDR that is marked as significant e.g. 0.05
    break_in_plot: []        # e.g. [22, 70]
    top_padding: 0
    custom_title: null

    width: 8
    height: 6
    file_format: "png"
